<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <script
      src="https://kit.fontawesome.com/bc194a3937.js"
      crossorigin="anonymous"
    ></script>
    <title>Order</title>
  </head>

  <body>
    <form>
      <h2>Make an order</h2>
      <input type="text" placeholder="Address" required />
      <input type="text" placeholder="Price" required />
      <input type="text" placeholder="Reciever" required />
      <button type="submit">Create</button>
    </form>
    <div class="orderBtnHidden">
      <button class="paidBtn">Paid</button>
      <button class="sentBtn">Sent</button>
      <button class="recievedBtn">Recieved</button>
      <button class="errorBtn">Test Error</button>
    </div>
    <div class="notificationsContainer"></div>
  </body>
  <script src="scripts/script.js"></script>
</html>
